[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "forensics-agent"
version = "0.1.0"
description = "LangGraph-based agentic system for image manipulation detection via MCP-exposed tools"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # LLM / Agent
    "langchain>=0.3",
    "langchain-google-genai>=2.0",      # Gemini
    "langchain-openai>=0.2",            # OpenAI-compatible endpoint (local vLLM)
    "langgraph>=0.2",
    "langchain-mcp-adapters>=0.1",

    # MCP
    "mcp[cli]>=1.7",

    # Schema / validation
    "pydantic>=2.7",

    # Image processing / detectors
    "Pillow>=10.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "scipy>=1.13",

    # API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # RAG / vector store
    "faiss-cpu>=1.8",
    "langchain-community>=0.3",

    # Observability
    "langsmith>=0.1",

    # Utilities
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "detectors*", "mcp_server*", "api*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
